[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "mockingbird"
version = "0.1.0"
description = "Local-first outdoor video intelligence API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anyio>=3.7,<4.0",
  "fastapi>=0.111,<0.116",
  "pydantic>=2.7,<3.0",
  "python-multipart>=0.0.9,<1.0",
  "SQLAlchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.scripts]
mockingbird-app = "mockingbird.runtime:main"

[project.optional-dependencies]
test = [
  "httpx>=0.27,<0.28",
  "pytest>=8.2,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
