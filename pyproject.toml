[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "mockingbird"
version = "0.1.0"
description = "Local-first outdoor video intelligence API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anyio>=3.7,<4.0",
  "fastapi>=0.111,<0.116",
  "Pillow>=10,<12",
  "pydantic>=2.7,<3.0",
  "python-multipart>=0.0.9,<1.0",
  "SQLAlchemy>=2.0,<3.0",
  "opencv-python-headless>=4.10,<5.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.scripts]
mockingbird-app = "mockingbird.runtime:main"

[project.optional-dependencies]
classifier-bioclip = [
  "open-clip-torch>=3.3,<3.4; python_version < '3.14'",
]
detector-megadetector = [
  "megadetector>=10.0.22,<11.0; python_version < '3.14'",
]
observation-onnx-cuda = [
  "numpy>=1.26,<3.0",
  "onnxruntime-gpu>=1.18,<2.0; python_version < '3.14'",
]
test = [
  "httpx>=0.27,<0.28",
  "pytest>=8.2,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "slow: heavyweight software-integration coverage (packaging, real subprocess servers/processes, real dependency installation into a real site-packages, large real-artifact hashing, real ffmpeg/PowerShell process launches). Excluded from the Fast (scripts/verify_fast.py) and Core (scripts/verify_core.py) gates; included in the Full gate (scripts/verify_full.py / plain `pytest`). See docs/test-suite-validation-tiers-contract.md.",
]

[tool.hatch.build.targets.wheel]
# `src/mockingbird/web_dist/` is a build-time-generated, gitignored copy of
# the built frontend (see web_app.py's `resolve_frontend_dist`, which already
# prefers this packaged path). Hatchling only includes VCS-tracked files by
# default; `artifacts` is its documented escape hatch for a generated file
# that must still ship in the wheel. See docs/local-product-packaging-design.md.
artifacts = ["src/mockingbird/web_dist/**/*"]
