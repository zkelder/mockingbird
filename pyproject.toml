[build-system]
# MIT Source License Adoption & Lane P Mechanical Closure v1: bumped from
# >=1.24. Empirically verified this milestone that hatchling 1.24-1.25
# rejects this file's own `license-files` array (PEP 639 style) outright
# with `TypeError: Field 'project.license-files' must be a table`; 1.26
# accepts it and copies the file into the wheel's dist-info but still emits
# pre-PEP-639 Metadata-Version 2.3 with no `License-Expression`/`License-File`
# header; 1.27 is the first version that emits complete Metadata-Version 2.4
# output (`License-Expression: MIT`, `License-File: LICENSE`). Raising the
# floor here is required for the `license`/`license-files` fields below to
# build correctly at all, not merely to prefer a newer default.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mockingbird"
# Final Release Candidate Corrections v1: restored to "0.1.0" -- the
# immediately preceding milestone's "1.0.0" bump (see git history) was its
# own SemVer-convention argument, not an authorized product-version
# decision; this repository is executing the MockingBird v0.1 public
# release, and "one public release" (see the one-release-roadmap
# reconciliation) never implied a 1.0.0 semantic version. See
# `tests/test_version_provenance.py` for the existing single-source-of-truth
# contract this value feeds (kept in sync by hand with
# `mockingbird.__init__._DEV_CHECKOUT_FALLBACK_VERSION`,
# `mockingbird_node.__version__`, and `web/package.json`).
version = "0.1.0"
description = "Local-first outdoor video intelligence API."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "anyio>=3.7,<4.0",
  "fastapi>=0.111,<0.116",
  "Pillow>=10,<12",
  "pydantic>=2.7,<3.0",
  "python-multipart>=0.0.9,<1.0",
  "SQLAlchemy>=2.0,<3.0",
  "opencv-python-headless>=4.10,<5.0",
  "uvicorn[standard]>=0.30,<1.0",
  # Environmental Context Foundation v1: local sunrise/sunset/day-night
  # computation. Pure Python, Apache-2.0, near-zero dependencies (confirmed
  # via wheel inspection: only conditional stdlib backports for old Python
  # / Windows tzdata) -- a plain core dependency, not an optional extra
  # the way the ML runtimes below are, and requires no network access.
  "astral>=3.2,<4.0",
]

[project.scripts]
mockingbird-app = "mockingbird.runtime:main"

[project.optional-dependencies]
classifier-bioclip = [
  "open-clip-torch>=3.3,<3.4; python_version < '3.14'",
]
detector-megadetector = [
  "megadetector>=10.0.22,<11.0; python_version < '3.14'",
]
observation-onnx-cuda = [
  "numpy>=1.26,<3.0",
  "onnxruntime-gpu>=1.18,<2.0; python_version < '3.14'",
]
# Acoustic / BirdNET Observation Foundation v1: a lightweight, CPU-only
# TFLite inference stack for the bundled BirdNET-Analyzer GLOBAL_6K_V2.4
# model (see docs/acoustic-birdnet-observation-foundation-v1-contract.md
# "BirdNET runtime decision"). `birdnetlib` itself only ever imports
# `tflite_runtime.interpreter`, falling back to a full `tensorflow`
# install; `tflite-runtime` is unavailable on PyPI for this project's
# supported Python versions (confirmed directly), so the app resolves
# `ai-edge-litert` (its maintained successor, same Interpreter API) under
# the `tflite_runtime` import name at runtime instead of depending on full
# TensorFlow -- see `mockingbird.species.birdnet_runtime`. `librosa`/
# `resampy`/`audioread` are real, hard imports of `birdnetlib` that its own
# package metadata does not declare (confirmed by direct installation, not
# assumed from its README) and must be pinned here explicitly.
classifier-birdnet = [
  "birdnetlib>=0.18,<0.19; python_version < '3.14'",
  "ai-edge-litert>=2.0,<3.0; python_version < '3.14'",
  "librosa>=0.10,<1.0; python_version < '3.14'",
  "resampy>=0.4,<1.0; python_version < '3.14'",
  "audioread>=3.0,<4.0; python_version < '3.14'",
]
test = [
  "httpx>=0.27,<0.28",
  "pytest>=8.2,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "slow: heavyweight software-integration coverage (packaging, real subprocess servers/processes, real dependency installation into a real site-packages, large real-artifact hashing, real ffmpeg/PowerShell process launches). Excluded from the Fast (scripts/verify_fast.py) and Core (scripts/verify_core.py) gates; included in the Full gate (scripts/verify_full.py / plain `pytest`). See docs/test-suite-validation-tiers-contract.md.",
]

[tool.hatch.build.targets.wheel]
# `src/mockingbird/web_dist/` is a build-time-generated, gitignored copy of
# the built frontend (see web_app.py's `resolve_frontend_dist`, which already
# prefers this packaged path). Hatchling only includes VCS-tracked files by
# default; `artifacts` is its documented escape hatch for a generated file
# that must still ship in the wheel. See docs/local-product-packaging-design.md.
artifacts = ["src/mockingbird/web_dist/**/*"]
